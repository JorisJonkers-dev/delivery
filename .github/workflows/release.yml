# Tag -> release flow (org standard).
#
# release-please maintains a release PR that accumulates conventional commits
# and, when merged, creates a vX.Y.Z git tag + GitHub Release and bumps the
# version manifest. Publishing of artifacts (Maven/npm to GitHub Packages,
# images to GHCR) hangs off the published-release event below.
#
# This gives every repo an explicit, immutable version. Consumers pin exact
# versions (see VERSIONING.md); nothing deploys or resolves from a moving
# branch.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      # Author the release PR with the personal-stack-agents App token (not the
      # default GITHUB_TOKEN) so CI runs on the PR without a manual approval
      # gate. Best-effort: falls back to GITHUB_TOKEN when the App secrets or
      # installation are absent.
      - uses: actions/create-github-app-token@v3
        id: app-token
        continue-on-error: true
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # One image per command, multi-arch (the estate's nodes are amd64 and arm64),
  # tagged with the release and pinned downstream by digest. The images lock
  # share this writes is what the estate pins each image by
  # (deploy-kit spec/v1/20-resolved-deployment.md#the-images-lock). One job:
  # jobs are billed by the minute, rounded up.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push each command's image, and write the images lock share
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          # Flagger's multi-arch index, by digest; the tag is for a reader.
          FLAGGER: ghcr.io/fluxcd/flagger:1.45.0@sha256:15b372d35012f9ae450f9030bc82217369c0aee082ed5a5225830010cf972b2b
        run: |
          VERSION="${TAG#v}"
          {
            echo "apiVersion: lock.jorisjonkers.dev/v1"
            echo "kind: ImagesLock"
            echo "schemaVersion: 1.0.0"
            echo "name: delivery"
            echo "images:"
          } > images.lock.yml
          # build <image> <docker build options...>: build and push one
          # multi-arch image, and append its lock entry.
          build() {
            local app="$1" image="ghcr.io/jorisjonkers-dev/delivery/$1" digest user
            shift
            docker buildx build . "$@" \
              --platform linux/amd64,linux/arm64 \
              --build-arg VERSION="$VERSION" \
              --tag "${image}:${TAG}" \
              --metadata-file "${app}.json" \
              --push
            digest="$(jq -r '."containerimage.digest"' "${app}.json")"
            # The user the image runs as, read back from what was pushed rather
            # than assumed from the Dockerfile.
            user="$(docker buildx imagetools inspect "${image}@${digest}" --format '{{ json .Image }}' \
              | jq -r 'if has("linux/amd64") then .["linux/amd64"] else . end | .config.User')"
            case "$user" in
              *[!0-9:]*|"") echo "::error::${app} runs as '${user}', not a numeric uid:gid"; exit 1 ;;
            esac
            {
              echo "  ${app}:"
              echo "    repository: ${image}"
              echo "    digest: \"${digest}\""
              echo "    uid: ${user%%:*}"
              echo "    gid: ${user##*:}"
            } >> images.lock.yml
            echo "published ${image}@${digest} as ${user}"
          }
          for app in release-gate collector vault-policy; do
            build "$app" --build-arg APP="$app"
          done
          # The backup method images the Platform document's engines name. The
          # project's share drops them, since the project file names none; the
          # Platform document's own lock pins them, by pull request in
          # JorisJonkers-dev/estate.
          for method in file-backup postgres-backup rabbitmq-backup; do
            build "$method" --file backup.Dockerfile --target "$method"
          done
          # Flagger is upstream's image, not built here, but this repository's
          # project file declares it, so its share locks it too. The digest is
          # pinned below and bumped by pull request; the user is read from the
          # image itself, whose config names it only as `nobody`.
          image="${FLAGGER%%:*}"
          digest="${FLAGGER##*@}"
          uid="$(docker run --rm --platform linux/amd64 --entrypoint id "$FLAGGER" -u)"
          gid="$(docker run --rm --platform linux/amd64 --entrypoint id "$FLAGGER" -g)"
          case "${uid}:${gid}" in
            *[!0-9:]*|:*|*:) echo "::error::flagger runs as '${uid}:${gid}', not a numeric uid:gid"; exit 1 ;;
          esac
          {
            echo "  flagger:"
            echo "    repository: ${image}"
            echo "    digest: \"${digest}\""
            echo "    uid: ${uid}"
            echo "    gid: ${gid}"
          } >> images.lock.yml
          echo "locked ${FLAGGER} as ${uid}:${gid}"
          cat images.lock.yml >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: images-lock
          path: images.lock.yml

  # This repository's own Intent Fragment, for the same release: the project
  # file, packed with the images lock share the job above wrote, pushed and
  # signed, and composition started in the estate
  # (deploy-kit spec/v1/40-composition.md#fragments).
  fragment:
    needs: [release-please, publish]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: JorisJonkers-dev/github-workflows/.github/workflows/publish-fragment.yml@v0.19.0
    with:
      project-file: deploy/delivery.project.yml
      version: ${{ needs.release-please.outputs.tag_name }}
      validate-with: deploy/env
      images-lock-artifact: images-lock
    secrets:
      ESTATE_DISPATCH_APP_PRIVATE_KEY: ${{ secrets.ESTATE_DISPATCH_APP_PRIVATE_KEY }}
