# One pipeline ending in "Pipeline Complete", the only required check (estate convention).
# Every check is its own job, and they run in parallel: a pull request waits for the slowest
# check rather than the sum of them, which is worth the extra minutes GitHub bills per job.
# Each job runs one `task`, the same tasks `task check` runs in sequence, so local and CI
# cannot drift.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.task }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Every failure is reported, not only the first.
      fail-fast: false
      matrix:
        task: [lint, schemas:check, gen:check, test, build, secrets]
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          cache: true

      - name: Run the task
        env:
          TASK: ${{ matrix.task }}
        run: mise exec -- task "$TASK"

  # The image builds need the Docker daemon the runner has, so they are not a task.
  images:
    name: Image (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: release-gate
            args: "--build-arg APP=release-gate"
          - image: collector
            args: "--build-arg APP=collector"
          - image: vault-policy
            args: "--build-arg APP=vault-policy"
          - image: file-backup
            args: "--file backup.Dockerfile --target file-backup"
          - image: postgres-backup
            args: "--file backup.Dockerfile --target postgres-backup"
          - image: rabbitmq-backup
            args: "--file backup.Dockerfile --target rabbitmq-backup"
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        env:
          IMAGE: ${{ matrix.image }}
          ARGS: ${{ matrix.args }}
        run: |
          # shellcheck disable=SC2086 # ARGS is a list of options, split on purpose
          docker build --build-arg VERSION=ci $ARGS -t "$IMAGE:ci" .

  # The one required check: green only when every job above is. `always()` so a failed or
  # cancelled job still reports here, as a failure, rather than leaving the check pending.
  pipeline-complete:
    name: Pipeline Complete
    if: ${{ always() }}
    needs: [check, images]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            [ "$result" = success ] || { echo "a job ended ${result}"; exit 1; }
          done
