# Everything the Reporter may do in the cluster: get or list four kinds, and nothing else
# (deploy-kit spec/v1/55-delivery.md#rollouts). It writes only to GitHub, never to the cluster.
#
# - Kustomizations, listed in Flux's namespace: each Project's unit, and the Rollout its
#   annotations name.
# - OCIRepositories, each unit's source: the digest the unit is pinned to.
# - Canaries, the ones a unit's inventory names: where Flagger is with each member.
# - Deployments, a settled member's and its primary's: whether the member changed in the
#   release, the same comparison the Release Gate makes.
#
# The envtest case in internal/reporter applies this file as it is and proves both halves: the
# Reporter's reads succeed under it, and every other verb and kind it tries is refused.
#
# deploy-kit renders the same grant from the `api` block of the reporter Process in
# deploy/delivery.project.yml; internal/declared holds the two to each other.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reporter
  namespace: delivery-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: delivery-reporter
rules:
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    verbs: [list]
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [ocirepositories]
    verbs: [get]
  - apiGroups: [flagger.app]
    resources: [canaries]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: delivery-reporter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: delivery-reporter
subjects:
  - kind: ServiceAccount
    name: reporter
    namespace: delivery-system
