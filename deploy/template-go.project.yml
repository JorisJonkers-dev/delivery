# deploy-kit Project Intent for a single stateless HTTP service. Shape follows
# spec/v1/examples/minimal in JorisJonkers-dev/deploy-kit.
#
# `template-go` is a placeholder: rename it to the service (see README.md).

apiVersion: intent.jorisjonkers.dev/v1
kind: Project
schemaVersion: 1.0.0

project: template-go # the namespace derives: template-go-system
owner: joris

applications:
  - id: template-go
    # Omit this block to run without monitoring; the template serves no /metrics yet.
    exposure:
      - name: public
        host: template-go.jorisjonkers.dev # the full FQDN, authored; replace on rename
        audience: anonymous
        contentPolicy: strict
        routes:
          - { path: /, match: prefix, process: template-go, surface: http }

    processes:
      - name: template-go
        lifecycle: application
        image: template-go # an alias; the lock resolves digest, uid and gid
        runtime: none # a static Go binary needs no Runtime Profile

        provides:
          http: 8080 # matches the default ADDR; above 1024, so no CAP_NET_BIND_SERVICE

        placement:
          memory: 64Mi
          cpu: 25m

        probes:
          readiness: { path: /readyz, port: 8080 }
          liveness: { path: /healthz, port: 8080 }

        startupBudget: 10s

        # No volumes, so a continuous cutover is honourable.
        cutover: continuous
